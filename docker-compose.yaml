# https://medium.com/@faidfadjri/how-to-setup-laravel-nginx-using-docker-2023-ba9de4b60d04
# version: "3"

networks:
  lemp:
    driver: bridge

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: ${SERVICE_RESTART}
    tty: true
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      # - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/sites:/etc/nginx/conf.d
      - ${SOURCE_FOLDER}:/var/www:delegated
    depends_on:
      - php-82
      - php-74
    networks:
      - lemp

  php-74:
    build:
      context: .
      dockerfile: Dockerfile.php74
      args:
        - INSTALL_MYSQLI=${PHP_FPM_INSTALL_MYSQLI}
        - INSTALL_BCMATH=${PHP_FPM_INSTALL_BCMATH}
        # - INSTALL_PGSQL=${PHP_FPM_INSTALL_PGSQL}
        # - INSTALL_OCI8=${PHP_FPM_INSTALL_OCI8}
        # - INSTALL_PGSQL=${PHP_FPM_INSTALL_PGSQL}
        # - INSTALL_PG_CLIENT=${PHP_FPM_INSTALL_PG_CLIENT}
        # - INSTALL_POSTGIS=${PHP_FPM_INSTALL_POSTGIS}
        # - INSTALL_PHPREDIS=${PHP_FPM_INSTALL_PHPREDIS}
        # - INSTALL_MONGO=${PHP_FPM_INSTALL_MONGO}
    container_name: php-74
    restart: ${SERVICE_RESTART}
    tty: true
    expose:
      - "9000"
    volumes:
      - ${SOURCE_FOLDER}:/var/www:delegated
      - ./php-fpm/php7.4.ini:/usr/local/etc/php/php.ini
    networks:
      - lemp
  
  php-82:
    build:
      context: .
      dockerfile: Dockerfile.php82
      args:
        - INSTALL_MYSQLI=${PHP_FPM_INSTALL_MYSQLI}
        - INSTALL_BCMATH=${PHP_FPM_INSTALL_BCMATH}
        # - INSTALL_PGSQL=${PHP_FPM_INSTALL_PGSQL}
        # - INSTALL_OCI8=${PHP_FPM_INSTALL_OCI8}
        # - INSTALL_PGSQL=${PHP_FPM_INSTALL_PGSQL}
        # - INSTALL_PG_CLIENT=${PHP_FPM_INSTALL_PG_CLIENT}
        # - INSTALL_POSTGIS=${PHP_FPM_INSTALL_POSTGIS}
        # - INSTALL_PHPREDIS=${PHP_FPM_INSTALL_PHPREDIS}
        # - INSTALL_MONGO=${PHP_FPM_INSTALL_MONGO}
    container_name: php-82
    restart: ${SERVICE_RESTART}
    tty: true
    expose:
      - "9000"
    volumes:
      - ./php-fpm/php8.2.ini:/usr/local/etc/php/php.ini
      - ${SOURCE_FOLDER}:/var/www:delegated
    networks:
      - lemp
  
